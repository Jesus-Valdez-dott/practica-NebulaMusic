<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            
            <!-- TAREA PARA EL ALUMNO:
                 Crea un formulario que envíe los datos mediante POST a "/crear-cuenta".
                 Debe contener campos para:
                 - Nombre completo (texto)
                 - Correo electrónico (email)
                 - Contraseña (password)
                 - Pseudónimo (texto con patrón de validación: [letras de 3 a 10]-[números de 2 a 10])
                 - Género (radio buttons: Femenino, Masculino, Otro)
                 - Tipo de Suscripción (select: Gratis, Premium Mensual, Premium Anual)
                 - Fecha de nacimiento (date)
                 - Aceptar términos y condiciones (checkbox)
                 - Comentarios adicionales o gustos (textarea)
            -->
            <form class="auth-form" method="post" action="/crear-cuenta" enctype="application/x-www-form-urlencoded">
                <!-- Escribe tus etiquetas (label) e inputs aquí -->
                <h1>Crear cuenta</h1>

                <div>
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="jesus valdez" required minlength="3" maxlength="80">
                </div>
                <div>
                    <label for="correo">Correo Electronico</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@gmail.com" required maxlength="100">
                </div>
                <div>
                    <label for="contrasenia">Contraseña</label>
                    <input type="password" id="contrasenia" name="contrasenia" placeholder="**********" required minlength="8" autocomplete="off">
                </div>
                <div>
                    <label for="pseudonimo">Pseudonimo</label>
                    <input type="text" id="pseudonimo" name="pseudonimo" required placeholder="nebula-2026" pattern="[a-zA-Z]{3,10}-[0-9]{2,10}" minlength="6" >
                </div>
                <div>
                    <label>Genero: </label>
                    <input type="radio" id="rad_femenino" name="genero" value="Femenino" required>
                    <label for="rad_femenino">Femenino</label>
                    <input type="radio" id="rad_masculino" name="genero" value="Masculino">
                    <label for="rad_masculino">Masculino</label>
                    <input type="radio" id="radio_transformer" name="genero" value="Transformer">
                    <label for="radio_transformer">Transformer</label>
                </div>
                <div>
                    <label for="suscripcion">Tipo de suscripcion</label>
                    <select id="suscripcion" name="suscripcion" required>
                        <option value="">----Seleciona una opcion----</option>
                        <option value="gratis">Gratis (con anuncios)</option>
                        <option value="premium_mensual">Premium Mensual (99/mes)</option>
                        <option value="premium_anual">Premium Anual (899/mes)</option>
                    </select>
                </div>
                <div>
                    <label for="fechaNacimiento">fecha de nacimimento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
                </div>
                <div>
                    <input type="checkbox" id="terminos" value="aceptado" required>
                    <label for="terminos">Acepto los terminos y condiciones de usuario</label>
                </div>
                <div>
                    <label for="comentarios">Comentarios o gustos </label>
                    <textarea id="comentarios" name="comentarios" rows="4" cols="40" placeholder="cuentanos que musica te gusta">

                    </textarea>
                </div>
                <div>
                    <button type="submit">Crear cuenta</button>
                    <button type="reset">Limpiar formulario</button>
                </div>
            </form>

        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
