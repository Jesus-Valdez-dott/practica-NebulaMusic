<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Iniciar Sesión</title>
    <link rel="stylesheet" href="../static/styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">

            <form method="post" action ="/autentation" enctype="application/x-www-form-urlencoded">
                <h1>Inicio de sesion</h1>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                    <button type="submit" class="btn-primary">Iniciar Sesión</button>
                    <button type="reset">Limpiar formulario</button>
                </div>
            </form>
            <p>¿Aun no tienes cuenta? <a href="registro.html"> Registrate aqui</a></p>
        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
